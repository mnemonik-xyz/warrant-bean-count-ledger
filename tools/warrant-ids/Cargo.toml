[package]
name = "warrant-ids"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Warrant identifiers and invoice facts for off-chain connectors; no zkVM dependency"

[dependencies]
# The Warrant core, pinned to one release. The identifiers come from this crate, so a connector
# never reimplements the commitment encoding. To upgrade, change the tag, run the tests and
# read docs/compatibility.md.
warrant-policy = { git = "https://github.com/mnemonik-xyz/policy-execution", tag = "core-v0.1.1" }
serde_json = "1.0"
hex = "0.4"
sha3 = "0.10"
anyhow = "1.0"
